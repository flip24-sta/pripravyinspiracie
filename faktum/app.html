<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>eFakturko — Aplikácia</title>
<meta name="theme-color" content="#7C3AED">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237C3AED'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='22' font-weight='800' font-family='Arial' fill='%23fff'%3Ee%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="faktum.css">
<style>
  /* ---------- app shell ---------- */
  .shell{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
  .side{background:#fff;border-right:1px solid var(--line);color:var(--text-2);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px;overflow-y:auto;z-index:40}
  .side .logo{color:var(--ink);padding:4px 8px 20px}
  .side-nav{display:flex;flex-direction:column;gap:2px}
  .side-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted-2);padding:16px 10px 6px;font-weight:700}
  .nav-i{display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border-radius:10px;font-size:14px;font-weight:600;color:var(--text-2);transition:background .12s,color .12s;position:relative}
  .nav-i svg{width:18px;height:18px;opacity:.8;flex:none}
  .nav-i:hover{background:var(--paper);color:var(--ink)}
  .nav-i.on{background:var(--violet-bg);color:var(--violet)}
  .nav-i.on:before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--lime)}
  .nav-i .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:var(--coral);color:#fff;border-radius:99px;padding:1px 7px}
  .nav-i .lock{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--violet);border:1px solid var(--line-2);border-radius:5px;padding:1px 5px}
  .side-foot{margin-top:auto;padding-top:16px}
  .usage{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;font-size:12.5px}
  .meter{height:6px;border-radius:99px;background:var(--paper-2);overflow:hidden;margin:6px 0 10px}
  .meter i{display:block;height:100%;background:var(--lime);border-radius:99px;transition:width .4s}
  .meter.warn i{background:var(--amber)}
  .meter.full i{background:var(--coral)}
  .main{min-width:0;display:flex;flex-direction:column}
  .top{height:66px;display:flex;align-items:center;gap:12px;padding:0 28px;border-bottom:1px solid var(--line);background:rgba(247,245,255,.85);backdrop-filter:blur(10px);position:sticky;top:0;z-index:30}
  .cmd{flex:1;max-width:520px;height:40px;border:1px solid var(--line-2);background:#fff;border-radius:12px;display:flex;align-items:center;gap:10px;padding:0 12px;color:var(--muted);cursor:pointer;font-size:14px;text-align:left}
  .cmd:hover{border-color:var(--ink)}
  .cmd svg{width:17px;height:17px;color:var(--violet)}
  .cmd .kbd{margin-left:auto}
  .top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
  .icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line-2);background:#fff;cursor:pointer;position:relative}
  .icon-btn svg{width:18px;height:18px}
  .icon-btn .dot{position:absolute;top:7px;right:8px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--coral);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid #fff}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;cursor:pointer;border:0}
  .menu-btn{display:none}
  .page{padding:28px;max-width:1240px;width:100%;margin:0 auto;animation:rise .25s}
  .page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .page-h h1{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1.1;letter-spacing:-.03em;color:var(--ink)}
  .page-h h1 em{font-style:normal;color:var(--violet);background:var(--violet-bg);padding:0 .14em;border-radius:.14em}
  .page-h .sub{color:var(--muted);margin-top:6px}
  .page-h .acts{display:flex;gap:8px;flex-wrap:wrap}
  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;position:relative;overflow:hidden}
  .kpi .l{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
  .kpi .v{font-family:var(--f-mono);font-size:26px;font-weight:700;letter-spacing:-.03em;margin:8px 0 4px}
  .kpi .d{font-size:12.5px}
  .kpi.dark{background:linear-gradient(150deg,#8B5CF6,#6D28D9);color:#fff;border-color:transparent}
  .kpi.dark .l{color:#EDE9FE}
  .up{color:#0F7A52}.down{color:#B3260E}
  .kpi.dark .up{color:#fff}
  .kpi.dark .down{color:#FFE4E6}
  .kpi.dark .muted{color:#EDE9FE}
  /* AI bar */
  .aibar{background:var(--ink);border-radius:22px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:12px;margin-bottom:18px;box-shadow:var(--sh-2)}
  .aibar .spark{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--violet),#B44CFF);display:grid;place-items:center;color:#fff;flex:none}
  .aibar .spark svg{width:16px;height:16px}
  .aibar input{flex:1;background:none;border:0;outline:none;color:#fff;font-size:15px;min-width:0;height:44px}
  .aibar input::placeholder{color:#B7A6E8}
  .sugg{display:flex;gap:8px;flex-wrap:wrap;margin:-8px 0 18px}
  .sugg button{border:1px solid var(--line-2);background:#fff;border-radius:99px;padding:6px 12px;font-size:12.5px;cursor:pointer;color:#34433C}
  .sugg button:hover{border-color:var(--violet);color:var(--violet)}
  .dash{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
  .dash>div{display:flex;flex-direction:column;gap:18px;min-width:0}
  /* chart */
  .chart{padding:18px 22px 14px}
  .chart svg{width:100%;height:auto;overflow:visible}
  .chart .lbls{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--f-mono);margin-top:8px}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  /* list rows */
  .rows{display:flex;flex-direction:column}
  .rowi{display:flex;align-items:center;gap:12px;padding:12px 22px;border-bottom:1px solid var(--line)}
  .rowi:last-child{border-bottom:0}
  .rowi .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;font-weight:700;font-size:13px}
  .rowi .t{flex:1;min-width:0}
  .rowi .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rowi .t span{font-size:12.5px;color:var(--muted)}
  .insight{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;gap:12px}
  .insight:last-child{border-bottom:0}
  .insight .k{width:8px;border-radius:4px;flex:none}
  .insight b{font-size:14px}
  .insight p{font-size:13.5px;color:#34433C;margin-top:2px}
  .check{display:flex;align-items:center;gap:12px;padding:11px 22px;font-size:14px;border-bottom:1px solid var(--line);cursor:pointer}
  .check:last-child{border-bottom:0}
  .check .bx{width:22px;height:22px;border-radius:7px;border:2px solid var(--line-2);display:grid;place-items:center;flex:none}
  .check.done{color:var(--muted);text-decoration:line-through}
  .check.done .bx{background:var(--mint);border-color:var(--mint);color:#fff}
  .progress{height:8px;background:var(--paper-2);border-radius:99px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .5s}
  /* tabs */
  .tabs{display:flex;gap:4px;background:var(--paper-2);border-radius:12px;padding:4px;width:max-content;max-width:100%;overflow-x:auto}
  .tabs button{border:0;background:none;padding:7px 14px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
  .tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--sh-1)}
  .tabs .n{font-family:var(--f-mono);font-size:11px;margin-left:5px;opacity:.7}
  .toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
  .search{position:relative}
  .search input{padding-left:36px;width:260px}
  .search svg{position:absolute;left:11px;top:12px;width:17px;height:17px;color:var(--muted)}
  /* editor */
  .editor{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
  .items{width:100%;border-collapse:collapse}
  .items th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:0 6px 8px;font-weight:600}
  .items td{padding:4px 6px;vertical-align:top}
  .items .input{height:38px}
  .items .rm{width:32px;height:38px;border:0;background:none;color:var(--muted-2);cursor:pointer;border-radius:8px}
  .items .rm:hover{background:var(--coral-bg);color:var(--coral)}
  .sum-row{display:flex;justify-content:space-between;padding:7px 0;font-size:14px}
  .sum-row.total{border-top:2px solid var(--ink);margin-top:8px;padding-top:12px;font-weight:800;font-size:18px}
  .sticky{position:sticky;top:84px}
  .ai-box{background:linear-gradient(135deg,#F3EFFF,#FBF7FF);border:1px solid #DCD2FF;border-radius:18px;padding:14px;display:flex;gap:10px;align-items:center;margin-bottom:18px}
  .ai-box input{flex:1;border:0;background:none;outline:none;font-size:15px;min-width:0}
  /* invoice paper */
  .paper{background:#fff;border-radius:6px;box-shadow:0 30px 60px -30px rgba(46,16,101,.35),0 0 0 1px var(--line);padding:48px 52px;font-size:13px;color:#14211C;position:relative;max-width:820px;margin:0 auto;aspect-ratio:auto}
  .paper .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:22px;border-bottom:3px solid var(--accent,#0C1A16)}
  .paper .brand{display:flex;gap:12px;align-items:center}
  .paper .brand .lg{width:46px;height:46px;border-radius:12px;background:var(--accent,#0C1A16);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px}
  .paper h2{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;letter-spacing:-.02em}
  .paper .parties{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:22px 0}
  .paper .parties .lb{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:6px;font-weight:700}
  .paper .meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#F7F5FF;border-radius:10px;padding:14px 16px;margin-bottom:20px}
  .paper .meta .lb{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
  .paper .meta b{font-family:var(--f-mono);font-size:13px}
  .paper table{width:100%;border-collapse:collapse}
  .paper th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid #E2DCF3}
  .paper td{padding:10px 6px;border-bottom:1px solid #EFEBF8}
  .paper .r{text-align:right}
  .paper .foot{display:grid;grid-template-columns:auto 1fr;gap:26px;margin-top:24px;align-items:end}
  .paper .qrbox{text-align:center;font-size:10px;color:var(--muted)}
  .paper .qrbox svg{width:130px;height:130px}
  .paper .qrbox .pbs{font-weight:800;color:#14211C;letter-spacing:.04em;margin-top:2px}
  .paper .grand{background:var(--accent,#0C1A16);color:#fff;border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  .paper .grand b{font-family:var(--f-mono);font-size:24px}
  .paper .note{margin-top:22px;font-size:12px;color:#4A5852;border-top:1px solid #EFEBF8;padding-top:14px}
  .paper .wm{margin-top:18px;font-size:11px;color:var(--muted);text-align:center}
  .paper .wm b{color:var(--ink)}
  .paid-stamp{position:absolute;right:56px;top:150px;transform:rotate(-14deg);border:4px solid var(--mint);color:var(--mint);font-weight:900;font-size:26px;letter-spacing:.14em;padding:6px 16px;border-radius:10px;opacity:.85}
  .detail{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
  .timeline{padding:6px 22px 16px}
  .tl{display:flex;gap:12px;padding:10px 0;font-size:13.5px;position:relative}
  .tl:before{content:"";position:absolute;left:5px;top:26px;bottom:-8px;width:2px;background:var(--line)}
  .tl:last-child:before{display:none}
  .tl i{width:12px;height:12px;border-radius:50%;background:var(--ink);margin-top:4px;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px var(--line-2)}
  .tl span{color:var(--muted);font-size:12px;display:block}
  /* onboarding */
  .ob{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
  .ob-l{background:linear-gradient(160deg,#6D28D9,#2E1065);color:#fff;padding:48px;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .ob-l:after{content:"";position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(196,181,253,.35),transparent 65%);right:-200px;bottom:-200px}
  .ob-l h1{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,4.6vw,64px);line-height:1;letter-spacing:-.03em;margin-top:auto}
  .ob-l h1 em{color:#DDD6FE;font-style:normal}
  .ob-l p{color:#9FB2A8;margin-top:16px;max-width:420px;font-size:16px}
  .ob-steps{display:flex;gap:8px;margin-top:40px;position:relative;z-index:1}
  .ob-steps i{flex:1;height:4px;border-radius:99px;background:var(--ink-3)}
  .ob-steps i.on{background:#fff}
  .ob-r{padding:48px;display:flex;align-items:center;justify-content:center;overflow-y:auto}
  .ob-form{width:100%;max-width:460px;display:flex;flex-direction:column;gap:16px;animation:rise .3s}
  .ob-form h2{font-size:28px;letter-spacing:-.02em}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg label{border:1.5px solid var(--line-2);border-radius:14px;padding:14px;cursor:pointer;background:#fff;display:flex;flex-direction:column;gap:2px}
  .seg label:has(input:checked){border-color:var(--ink);box-shadow:0 0 0 4px rgba(124,58,237,.18)}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg b{font-size:15px}
  .seg span{font-size:12.5px;color:var(--muted)}
  .plan-pick{display:flex;flex-direction:column;gap:10px}
  .plan-pick label{border:1.5px solid var(--line-2);border-radius:16px;padding:14px 16px;cursor:pointer;background:#fff;display:flex;align-items:center;gap:12px}
  .plan-pick label:has(input:checked){border-color:var(--ink);box-shadow:0 0 0 4px rgba(124,58,237,.18)}
  .plan-pick input{accent-color:var(--ink)}
  .plan-pick .pr{margin-left:auto;font-family:var(--f-mono);font-weight:700}
  .inline{display:flex;gap:8px}
  .inline .input{flex:1}
  /* paywall */
  .pw-hero{background:linear-gradient(150deg,#7C3AED,#2E1065);color:#fff;border-radius:18px;padding:22px;margin-bottom:16px;position:relative;overflow:hidden}
  .pw-hero h3{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05}
  .pw-hero h3 em{color:#DDD6FE;font-style:normal}
  .pw-plans{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pw-plan .p{font-size:18px!important}
  .pw-plan{border:1.5px solid var(--line-2);border-radius:16px;padding:16px;cursor:pointer;position:relative}
  .pw-plan.on{border-color:var(--ink);box-shadow:0 0 0 4px rgba(124,58,237,.18)}
  .pw-plan .p{font-family:var(--f-mono);font-size:22px;font-weight:700;margin:6px 0 2px}
  .pw-list{display:flex;flex-direction:column;gap:7px;font-size:13.5px;margin:14px 0}
  .pw-list div:before{content:"✓  ";color:var(--mint);font-weight:800}
  .locked{position:relative}
  .locked>.blur{filter:blur(6px);pointer-events:none;user-select:none;opacity:.7}
  .locked>.over{position:absolute;inset:0;display:grid;place-items:center;padding:20px}
  .lock-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;text-align:center;max-width:420px;box-shadow:var(--sh-3)}
  /* chat */
  .chat{display:flex;flex-direction:column;gap:12px;padding:20px;min-height:360px;max-height:56vh;overflow-y:auto}
  .msg{max-width:80%;padding:12px 15px;border-radius:16px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;animation:rise .2s}
  .msg.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:5px}
  .msg.ai{align-self:flex-start;background:var(--violet-bg);border-bottom-left-radius:5px}
  .msg .src{display:block;font-size:11px;color:var(--muted);margin-top:6px}
  .chat-in{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line)}
  .chat-in input{flex:1}
  /* tax */
  .gauge{position:relative;height:14px;background:var(--paper-2);border-radius:99px;overflow:hidden;margin:10px 0 6px}
  .gauge i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--mint),var(--amber),var(--coral));border-radius:99px}
  .gauge .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .cmp>div{border:1.5px solid var(--line);border-radius:16px;padding:16px}
  .cmp>div.best{border-color:var(--violet);background:#F7F5FF}
  .kv{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0}
  .kv b{font-family:var(--f-mono)}
  .deadline{display:flex;gap:14px;align-items:center;padding:12px 22px;border-bottom:1px solid var(--line)}
  .deadline:last-child{border-bottom:0}
  .deadline .dt{width:52px;text-align:center;border-radius:12px;background:var(--paper);padding:6px 0;flex:none}
  .deadline .dt b{display:block;font-family:var(--f-mono);font-size:18px;line-height:1.1}
  .deadline .dt span{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:700}
  /* admin */
  .admin-top{background:var(--ink);color:#fff;padding:0 28px;height:66px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:30}
  .admin-top .logo{color:#fff}
  .badge-admin{background:var(--coral);color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:6px}
  .mini{display:flex;align-items:flex-end;gap:3px;height:120px}
  .mini i{flex:1;background:#A78BFA;border-radius:3px 3px 0 0;min-height:2px;position:relative}
  .mini i:hover{background:var(--violet)}
  .donut{display:flex;gap:18px;align-items:center}
  .feat-bar{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 0}
  .feat-bar span{width:140px;flex:none}
  .feat-bar .progress{flex:1}
  .feat-bar b{font-family:var(--f-mono);width:56px;text-align:right}
  .notif{display:flex;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line);cursor:pointer}
  .notif.unread{background:#F7F5FF}
  .notif .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
  .notif .ic svg{width:18px;height:18px}
  .notif b{font-size:14px}
  .notif p{font-size:13.5px;color:#34433C}
  .notif span{font-size:12px;color:var(--muted)}
  .drop{position:absolute;right:0;top:48px;width:min(380px,calc(100vw - 24px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-3);overflow:hidden;z-index:60;animation:rise .15s}
  .drop .card-h{padding:14px 18px}
  .drop .notif{padding:12px 18px}
  .scrim{display:none}
  @media print{
    body *{visibility:hidden}
    .paper,.paper *{visibility:visible}
    .paper{position:absolute;left:0;top:0;width:100%;box-shadow:none;max-width:none;padding:24px 28px}
    @page{margin:12mm}
